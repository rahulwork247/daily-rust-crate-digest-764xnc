name: Daily Rust Crate Digest

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run generator
        run: python generate_feed.py
      - name: Commit & Push feed
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add feed.json
          git commit -m 'Update feed for ${{ github.run_date }}' || echo 'No changes'
          git push
